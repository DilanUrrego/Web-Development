<main>
    <section id="login-box">
        <h2>{{title}}</h2>
        <form [formGroup]="signUpForm">
            <label>Nombre de usuario</label>
            <input type="text" id="username" formControlName="username" />
            <label>Email</label>
            <input type="text" id="email" formControlName="email"/>
            <label>Contraseña</label>
            <input type="password" id="password" placeholder="Ingrese contraseña" formControlName="password"/>
            <label>Confirmar contraseña</label>
            <input type="password" id="rePassword" placeholder="Confirme contraseña" formControlName="rePassword"/>
        </form>
        <a class="primary" (click)="onSignUp()">Crear usuario</a>
        <a class="secondary" routerLink="ruta">Regresar</a>
    </section>
</main>
